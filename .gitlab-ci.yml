stages:
  - deploy

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    # Install ssh-agent if not already installed, it is required by Docker.
    - 'command -v ssh-agent >/dev/null || ( apk add --update openssh-client )'
    # Run ssh-agent (inside the build environment)
    - eval $(ssh-agent -s)
    # Add the SSH key stored in SSH_PRIVATE_KEY variable to the agent store
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Create the SSH directory and give it the right permissions
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add the VPS server's SSH key to known_hosts to prevent strict host checking errors
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to VPS..."
    # Connect to the VPS, pull the latest code, and restart the backend
    - ssh $VPS_USER@$VPS_IP "cd /home/developer/sketrium-backend && git pull origin main && npm install && npm run build && pm2 restart sketrium-backend"
    - echo "Deployment successful!"
