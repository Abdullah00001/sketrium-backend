name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        rsync -avz --exclude '.git' --exclude 'node_modules' ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/home/developer/sketrium-backend/
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "cd /home/developer/sketrium-backend && npm install && npm run build && pm2 restart sketrium-backend"
